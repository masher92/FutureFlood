name: geo_env
channels:

* conda-forge
  dependencies:
* python=3.10

# Core geospatial stack (kept consistent via conda-forge)

* geopandas
* rioxarray
* rasterio
* pyproj
* gdal
* shapely
* fiona

# Data handling

* pandas
* numpy
* xarray

# Plotting (useful for your analysis)

* matplotlib
* seaborn

# Jupyter (classic, stable)

* notebook=6.5
* ipykernel

# Optional but useful

* scipy
* tqdm

# Ensure pip is available (but avoid using it for geo libs)

* pip
